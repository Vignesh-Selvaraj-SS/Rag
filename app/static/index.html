<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Insurance Claims RAG</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f4;
    --card: #ffffff;
    --text: #1c1c1c;
    --muted: #6b6b6b;
    --border: #ddd;
    --accent: #2f5d50;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --card: #242424;
      --text: #eaeaea;
      --muted: #999;
      --border: #3a3a3a;
      --accent: #4f9d87;
      --accent-text: #0d0d0d;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  main {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 1.3rem;
    margin: 0 0 4px;
  }
  p.subtitle {
    color: var(--muted);
    margin: 0 0 24px;
    font-size: 0.9rem;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 16px;
  }
  textarea {
    width: 100%;
    min-height: 70px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font-size: 1rem;
    font-family: inherit;
    resize: vertical;
  }
  .row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    align-items: center;
  }
  button {
    border: none;
    border-radius: 8px;
    padding: 10px 16px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: inherit;
  }
  button.primary {
    background: var(--accent);
    color: var(--accent-text);
  }
  button.secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
  }
  button:disabled {
    opacity: 0.5;
    cursor: default;
  }
  select {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 0.85rem;
    font-family: inherit;
    background: var(--card);
    color: var(--text);
  }
  select:disabled {
    opacity: 0.5;
    cursor: default;
  }
  .status {
    font-size: 0.85rem;
    color: var(--muted);
  }
  .answer {
    margin-top: 4px;
    white-space: pre-wrap;
    line-height: 1.5;
  }
  .sources {
    margin-top: 12px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .sources span {
    display: inline-block;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 2px 8px;
    margin-right: 6px;
  }
  .error {
    color: #c0392b;
  }
  .hidden { display: none; }
  .samples {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }
  .samples button {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.8rem;
  }
  .samples button:hover {
    border-color: var(--accent);
  }
</style>
</head>
<body>
<main>
  <h1>Insurance Claims RAG</h1>
  <p class="subtitle">Answers only from the documents in <code>data/</code>. Cites the file and page.</p>

  <div class="card">
    <textarea id="question" placeholder="e.g. What deductible applies to a water backup claim?"></textarea>
    <div class="row">
      <button class="primary" id="ask">Ask</button>
      <select id="strategy" title="Chunking strategy used when rebuilding the index">
        <option value="heading">Chunk by heading</option>
        <option value="fixed_size">Chunk by fixed size</option>
      </select>
      <button class="secondary" id="ingest" title="Rebuild the index from data/">Rebuild index</button>
      <span class="status" id="status"></span>
    </div>
    <div class="samples" id="samples"></div>
  </div>

  <div class="card hidden" id="result">
    <div class="answer" id="answerText"></div>
    <div class="sources" id="sourcesText"></div>
  </div>
</main>

<script>
  const questionEl = document.getElementById("question");
  const askBtn = document.getElementById("ask");
  const ingestBtn = document.getElementById("ingest");
  const strategyEl = document.getElementById("strategy");
  const statusEl = document.getElementById("status");
  const resultEl = document.getElementById("result");
  const answerEl = document.getElementById("answerText");
  const sourcesEl = document.getElementById("sourcesText");
  const samplesEl = document.getElementById("samples");

  const SAMPLE_QUESTIONS = [
    "What deductible applies to a water backup claim?",
    "Is a dented metal roof covered?",
    "Someone opened a credit card in my name, what's covered?",
    "My air conditioner broke down suddenly, is that a claim?",
    "How much jewellery is covered without an appraisal?",
    "How quickly will someone contact me after I report a claim?",
  ];

  for (const sample of SAMPLE_QUESTIONS) {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = sample;
    button.addEventListener("click", () => {
      questionEl.value = sample;
      questionEl.focus();
    });
    samplesEl.appendChild(button);
  }

  function setBusy(busy, message) {
    askBtn.disabled = busy;
    ingestBtn.disabled = busy;
    strategyEl.disabled = busy;
    statusEl.textContent = message || "";
    statusEl.classList.remove("error");
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;
  }

  function showError(message) {
    resultEl.classList.remove("hidden");
    answerEl.textContent = "";
    answerEl.classList.add("error");
    answerEl.textContent = message;
    sourcesEl.textContent = "";
  }

  async function ask() {
    const question = questionEl.value.trim();
    if (!question) return;

    setBusy(true, "Thinking...");
    resultEl.classList.add("hidden");
    answerEl.classList.remove("error");

    try {
      const response = await fetch("/api/v1/chat/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question }),
      });

      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        showError(body.detail || `Request failed (${response.status})`);
        return;
      }

      const data = await response.json();
      resultEl.classList.remove("hidden");
      answerEl.textContent = data.answer;

      sourcesEl.innerHTML = data.sources.length
        ? "Sources: " + data.sources.map(s =>
            `<span>${escapeHtml(s.source)} &gt; ${escapeHtml(s.heading)} (${escapeHtml(s.page)})</span>`
          ).join(", ")
        : "No sources cited.";
    } catch (err) {
      showError("Could not reach the API. Is the server running?");
    } finally {
      setBusy(false);
    }
  }

  async function ingest() {
    const strategy = strategyEl.value;

    setBusy(true, `Rebuilding index (${strategy})...`);
    resultEl.classList.add("hidden");

    try {
      const response = await fetch("/api/v1/ingest", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ strategy }),
      });

      const data = await response.json();

      if (!response.ok) {
        showError(data.detail || `Request failed (${response.status})`);
        return;
      }

      resultEl.classList.remove("hidden");
      answerEl.textContent =
        `Indexed ${data.documents} documents, ${data.chunks} chunks ` +
        `using the "${data.strategy}" strategy.`;
      sourcesEl.textContent = "";
    } catch (err) {
      showError("Could not reach the API. Is the server running?");
    } finally {
      setBusy(false);
    }
  }

  askBtn.addEventListener("click", ask);
  ingestBtn.addEventListener("click", ingest);
  questionEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      ask();
    }
  });
</script>
</body>
</html>
